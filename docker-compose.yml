version: '3.8'

services:
  sqldumper:
    build: .
    container_name: sqldumper-app
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=${SECRET_KEY:-change-this-key}
      - API_KEYS=${API_KEYS:-default-key-change-in-production}
      - PORT=5000
    volumes:
      - ./logs:/app/logs
    restart: always
    networks:
      - dumper-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  nginx:
    image: nginx:alpine
    container_name: sqldumper-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./logs:/var/log/nginx
    depends_on:
      - sqldumper
    networks:
      - dumper-net
    restart: always

networks:
  dumper-net:
    driver: bridge
